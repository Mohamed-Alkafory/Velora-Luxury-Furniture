<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | Velora Luxury Furniture</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <nav class="navbar scrolled">
      <div class="container">
        <a href="index.html" class="logo">
          <div class="logo-text">VELORA</div>
        </a>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li>
            <a href="index.html#categories" class="nav-link">Collections</a>
          </li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
          <li><a href="order.html" class="nav-link">Order Now</a></li>
        </ul>
        <div class="nav-actions">
          <a href="cart.html" class="nav-icon-link active">
            <i data-lucide="shopping-bag" class="nav-icon"></i>
            <span class="cart-badge">0</span>
          </a>
          <a href="signin.html" class="btn btn-outline nav-btn">Sign In</a>
        </div>
      </div>
    </nav>

    <header class="page-hero">
      <div class="container animate-fade-up">
        <h1 class="page-title">Your Cart</h1>
        <p class="page-subtitle">Review your selection of artisanal luxury.</p>
      </div>
    </header>

    <main class="cart-container container">
      <div id="cart-content">
        <!-- Cart items will be injected here -->
        <div class="loading-state">
          <p>Loading your cart...</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer-grid">
          <div class="footer-col">
            <div class="logo">
              <div class="logo-text">VELORA</div>
            </div>
            <p class="footer-text">
              Elevating your living space with timeless design since 1994.
            </p>
          </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2026 Velora Luxury Furniture. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script type="module" src="js/cart.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
