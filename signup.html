<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Velora Luxury Furniture</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" class="logo auth-logo">
          <div class="logo-text">VELORA</div>
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">
          Join the Velora atelier for an exclusive experience.
        </p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-input"
            placeholder="e.g. Jean-Luc Picard"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
          <div class="password-strength-container" id="strength-container">
            <div class="strength-bar">
              <div class="strength-progress"></div>
            </div>
            <span class="strength-text">Password Strength</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full mt-2">
          Sign Up
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="signin.html">Sign In</a>
      </div>
    </div>

    <script type="module" src="js/signup.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
