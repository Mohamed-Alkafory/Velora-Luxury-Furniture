<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Velora Luxury Furniture</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <a
          href="index.html"
          class="logo"
          style="display: flex; margin-bottom: 2rem; justify-content: center"
        >
          <svg
            class="logo-mark"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient
                id="logo-grad"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" style="stop-color:#c8a46b;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#e7c185;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#a6854f;stop-opacity:1" />
              </linearGradient>
            </defs>
            <path
              d="M25 20 H35 L50 80 L65 20 H75 L50 90 L25 20Z"
              fill="url(#logo-grad)"
            />
            <path
              d="M20 20 H40 V24 H20 V20Z"
              fill="url(#logo-grad)"
            />
            <path
              d="M60 20 H80 V24 H60 V20Z"
              fill="url(#logo-grad)"
            />
            <path
              d="M68 22 C75 15, 85 18, 92 12 Q85 25, 70 28 Z"
              fill="url(#logo-grad)"
            />
            <path
              d="M72 28 C80 22, 90 25, 95 20 Q88 32, 74 34 Z"
              fill="url(#logo-grad)"
            />
            <path
              d="M75 34 C82 28, 92 31, 97 26 Q90 38, 77 40 Z"
              fill="url(#logo-grad)"
            />
          </svg>
          <div class="logo-text">VELORA</div>
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">
          Join the Velora atelier for an exclusive experience.
        </p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-input"
            placeholder="e.g. Jean-Luc Picard"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
          <div class="password-strength-container" id="strength-container">
            <div class="strength-bar"><div class="strength-progress"></div></div>
            <span class="strength-text">Password Strength</span>
          </div>
        </div>
        <button
          type="submit"
          class="btn btn-primary"
          style="width: 100%; margin-top: 2rem"
        >
          Sign Up
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="signin.html">Sign In</a>
      </div>
    </div>

    <script type="module">
      import auth from "./js/auth.js";
      import { showToast } from "./js/main.js";

      const passwordInput = document.getElementById("password");
      const strengthContainer = document.getElementById("strength-container");
      const signupForm = document.getElementById("signup-form");

      // Password strength listener
      passwordInput.addEventListener("input", (e) => {
        const strength = auth.checkPasswordStrength(e.target.value);
        strengthContainer.className = `password-strength-container strength-${strength}`;

        const texts = ["Very Weak", "Weak", "Medium", "Strong", "Excellent"];
        strengthContainer.querySelector(".strength-text").innerText =
          `Strength: ${texts[strength]}`;
      });

      // Form submission
      signupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const userData = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: passwordInput.value,
        };

        if (passwordInput.value.length < 8) {
          showToast("Password must be at least 8 characters", "error");
          return;
        }

        const result = auth.register(userData);
        if (result.success) {
          showToast(result.message, "success");
          setTimeout(() => (window.location.href = "signin.html"), 1500);
        } else {
          showToast(result.message, "error");
        }
      });
    </script>
  </body>
</html>
