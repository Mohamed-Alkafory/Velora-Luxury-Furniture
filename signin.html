<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Velora Luxury Furniture</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" class="logo auth-logo">
          <div class="logo-text">VELORA</div>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to continue.</p>
      </div>

      <form id="signin-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-full mt-1">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Join Us</a>
      </div>
    </div>

    <script type="module" src="js/signin.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
